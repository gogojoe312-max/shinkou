<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>進行 — スマホ幅の表示確認</title>
<style>*{box-sizing:border-box}body{margin:0;background:#27272b;color:#eee;font:14px system-ui}header{padding:16px 24px}button{margin-top:10px;padding:8px 14px;background:#41414a;color:#fff;border:0;border-radius:8px;font:inherit}body.keyboard-preview #compact{height:388px}body.keyboard-preview #wide{height:476px}p{margin:5px 0;color:#aaa}main{display:flex;gap:24px;padding:0 24px 24px;align-items:start}section{flex:none}h2{font-size:14px;font-weight:400}iframe{display:block;border:0;background:#111113;width:390px;height:844px}#wide{width:430px;height:932px}</style>
<header>スマホ幅で公開デモを確認<p>iPhoneの画面幅を参考にしたレイアウト確認です。Safariや実機キーボードの再現ではありません。</p><button id="toggleHeight" type="button" aria-pressed="false">キーボード表示時の高さで確認</button></header>
<main><section><h2>390 × 844</h2><iframe id="compact" title="390pxの進行" src="../?demo=1&v=20260923a"></iframe></section><section><h2>430 × 932</h2><iframe id="wide" title="430pxの進行" src="../?demo=1&v=20260923a"></iframe></section></main><script>document.getElementById("toggleHeight").onclick=function(){const active=document.body.classList.toggle("keyboard-preview");this.setAttribute("aria-pressed",String(active));this.textContent=active?"通常の高さへ戻す":"キーボード表示時の高さで確認"}</script></html>
