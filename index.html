<title>進行 — 制作進行管理</title>
<style>
:root{
  color-scheme:dark;
  --bg:#16171B; --panel:#1E2025; --panel2:#24272D; --line:#2D3038; --line2:#3B4049;
  --ink:#E9E7E2; --dim:#8C919B; --dim2:#666B76; --ghost:#4E535C;
  --me:#2FC08A; --other:#8A93A6; --room:#8A93A6;
  --ok:#2FC08A; --warn:#E8A33D; --late:#FF6B6B;
  --r:7px;
  --jp:"Noto Sans JP",system-ui,sans-serif;
  --disp:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
/* touch-action:manipulation ＝ 素早く2回触っても拡大しない。指2本の拡大とスクロールは残る */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:14px;line-height:1.6;
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%;
  min-height:100vh;min-height:100dvh}
/* iOS は文字が16px未満の入力欄で勝手に拡大するので、指で触る端末では16pxにする */
@media (pointer:coarse){
  .inp,.field input,select.sel,textarea.inp{font-size:16px}
  .inp.dt,.inp.cdt,.slot .inp,.prow .inp,.st input[type="date"]{font-size:16px}
  .btn,.qc,.tgl{min-height:38px}
  .chk{width:24px;height:24px}
  .xb{width:32px;height:32px}
}
button,.grip,.chk{-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}

.top{position:sticky;top:0;z-index:40;background:rgba(22,23,27,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 14px 11px;padding-top:calc(10px + env(safe-area-inset-top,0))}
.toprow{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:.06em;line-height:1}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.18em;color:var(--dim2);margin-top:3px}
.spacer{flex:1}
#saveDot{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dim2);white-space:nowrap}
#saveDot.busy{color:var(--warn)}
#syncDot{font-family:var(--mono);font-size:9px;letter-spacing:.1em;white-space:nowrap;display:none;
  border:1px solid var(--line);border-radius:9px;padding:2px 7px;color:var(--dim2)}
#syncDot.busy,#syncDot.wait{color:var(--warn);border-color:#4A3A22}
#syncDot.ok{color:var(--ok);border-color:rgba(47,192,138,.4)}
#syncDot.err{color:var(--late);border-color:#4A2E33}
#syncDot.offline{color:var(--dim2)}
.iconbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;color:var(--dim);font-size:15px;flex-shrink:0}
.iconbtn:hover{border-color:var(--line2);color:var(--ink)}

.dirbar{display:flex;gap:6px;overflow-x:auto;margin-top:11px;padding-bottom:2px;scrollbar-width:none}
.dirbar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:12px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip b{font-family:var(--mono);font-size:11px;color:var(--dim2);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:#16171B;border-color:var(--ink);font-weight:700}
.chip[aria-pressed="true"] b{color:#16171B;opacity:.6}

.tools{display:flex;gap:8px;margin-top:10px}
.tools .field:focus-within ~ select.sel{display:none}
.tools .field:focus-within{flex:1 1 100%}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:0 9px;background:var(--panel)}
.field input{flex:1;min-width:0;background:none;border:none;padding:8px 0;font-size:13px}
.field input::placeholder{color:var(--dim2)}
select.sel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 9px;font-size:12px;color:var(--dim);flex-shrink:0;max-width:38vw}

main{padding:14px 14px 158px}
.artist{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.02em;margin:26px 0 2px;display:flex;align-items:baseline;gap:9px}
main>.artist:first-child{margin-top:2px}
.artist .n{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--dim2);letter-spacing:.06em}
.artline{height:2px;background:var(--line2);margin-bottom:12px}

.proj{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;cursor:pointer}
.proj h3{margin:0;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.02em}
.proj .rel{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.proj .rel.near{color:var(--warn)}
.caret{color:var(--dim2);font-size:9px;transition:transform .18s}
.proj[aria-expanded="false"] .caret{transform:rotate(-90deg)}

.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);padding:11px 12px;margin-bottom:8px;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--line2);background:var(--panel2)}
.card.late{border-left:3px solid var(--late)}
.card.warn{border-left:3px solid var(--warn)}
.card.fin{opacity:.5}
.cardtop{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ct{font-family:var(--disp);font-weight:700;font-size:15.5px;line-height:1.3;
  overflow-wrap:anywhere;flex:1 1 auto;min-width:0}
.balls{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 7px}
.balls .ball{margin-left:0;max-width:100%}
.balls:empty{display:none}
.cmemo{font-size:11.5px;line-height:1.55;color:var(--dim);white-space:pre-wrap;
  border-left:2px solid var(--line2);padding:1px 0 1px 9px;margin:0 0 9px}
.ball{margin-left:auto;flex-shrink:0;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden}
.ball i{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;font-style:normal}
.ball span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ball u{text-decoration:none;font-family:var(--mono);font-size:9px;font-weight:400;opacity:.72;white-space:nowrap;flex-shrink:0}
.ball.me{color:var(--me);background:rgba(47,192,138,.13)}
.ball.other{color:var(--other);background:rgba(109,139,255,.13)}
.ball.room{color:var(--room);background:rgba(181,123,255,.13)}
.ball.none{color:var(--dim2);background:rgba(140,145,155,.1)}
.ball.todo{color:var(--dim2);background:transparent;border:1px dashed var(--line2)}
.ball.wait{color:var(--warn);background:rgba(232,163,61,.12)}
.ball.late{color:var(--late);background:rgba(228,90,90,.12)}

.now{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:9px;color:var(--dim)}
.now b{color:var(--ink);font-weight:800;font-size:15px}
.now .dl{margin-left:auto;font-family:var(--mono);font-size:11.5px;flex-shrink:0;display:flex;align-items:baseline;gap:6px}
.now .dl .dln{font-size:14px;font-weight:700;font-style:normal}
.now .dl .dld{font-size:10.5px;color:var(--dim2)}
.now .dl.late{color:var(--late)} .now .dl.warn{color:var(--warn)}

.bar{display:flex;gap:3px;margin:0 0 8px}
.bar i{flex:1;height:4px;border-radius:2px;background:var(--line);font-style:normal}
.bar i.on{background:var(--ok)}
.bar i.cur{background:var(--me)}
.bar i.prov{background:rgba(47,192,138,.4)}

.qdt{position:relative;flex-shrink:0}

.lock .box{width:min(340px,100%);text-align:center}
